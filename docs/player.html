<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Player · Player Fee Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #f6f6f3; --surface: #ffffff; --raised: #fbfbfa; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e9e8e2; --axis: #d2d1c8; --hover: #f3f2ee; --model: #2a78d6; --tm: #eb6834; --accent: #2a78d6;
  --accent-soft: #e6f0fc; --up: #0f7a55; --up-soft: #e2f5ee; --down: #b93232; --down-soft: #fbe9e9;
  --gk: #eda100; --def: #4a3aa7; --mid: #1baf7a; --att: #e34948;
  --shadow: 0 1px 2px rgba(11, 11, 11, .04), 0 8px 24px rgba(11, 11, 11, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #171716; --raised: #1d1d1c; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2a2a28; --axis: #383835; --hover: #20201f; --model: #3987e5; --tm: #d95926; --accent: #3987e5;
    --accent-soft: #14263d; --up: #4fd3a4; --up-soft: #12281f; --down: #f08a8a; --down-soft: #331a1a;
    --gk: #c98500; --def: #9085e9; --mid: #199e70; --att: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
.back { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-2); text-decoration: none;
  padding: 8px 12px 8px 8px; border-radius: 10px; margin: 0 0 12px -8px; }
.back:hover { background: var(--hover); color: var(--ink); }
.crest { width: 20px; height: 20px; object-fit: contain; flex: none; }
.crest.big { width: 26px; height: 26px; }

/* header: photo, name and facts on the left, the value on the right */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 132px minmax(0, 1fr) 250px; overflow: hidden; margin-bottom: 16px; }
.photo { width: 132px; height: 100%; min-height: 172px; background: var(--hover); object-fit: cover; object-position: top;
  display: grid; place-items: center; font-size: 34px; font-weight: 700; color: var(--ink-2); }
.who { padding: 18px 22px; min-width: 0; }
h1 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 6px; }
.clubline { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 500; flex-wrap: wrap; }
.clublink { color: inherit; text-decoration: none; border-bottom: 1px solid var(--axis); }
.clublink:hover { color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 28px; margin: 14px 0 0; font-size: 13px; }
.facts div { display: flex; gap: 8px; min-width: 0; }
.facts dt { color: var(--muted); flex: none; }
.facts dd { margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.value { background: var(--accent-soft); border-left: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.value small { color: var(--ink-2); font-size: 12px; }
.value .big { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.value .tm { margin-top: 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.value .tm b { font-size: 16px; }
.value .buyer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--axis); }
.value .buyer b { display: flex; align-items: center; gap: 8px; font-size: 18px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 7px; white-space: nowrap; }
.chip.up { color: var(--up); background: var(--up-soft); }
.chip.down { color: var(--down); background: var(--down-soft); }

/* boxes */
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
.box > h2 { margin: 0; padding: 11px 16px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
  border-bottom: 1px solid var(--line); background: var(--raised); }
.box > .in { padding: 14px 16px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 16px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { text-align: left; }
td.club, th.club { text-align: left; }
details.more td:first-child { white-space: normal; }
details.more td { padding: 8px 10px 8px 16px; }
td.club span { display: inline-flex; align-items: center; gap: 6px; }
td.fee { font-weight: 600; }
td.fee.soft { font-weight: 400; color: var(--ink-2); }
.scroll { overflow-x: auto; }

/* why this price */
.sum { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.sum b { color: var(--ink); font-size: 15px; }
.why { list-style: none; margin: 0; padding: 0; }
.why li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.why li div { min-width: 0; }
.why li small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.more { border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; padding: 11px 16px; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+ "; }
details.more[open] summary::before { content: "− "; }
.note { color: var(--muted); font-size: 12px; margin: 0; padding: 0 16px 14px; }

/* chart */
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; box-shadow: var(--shadow); }
.missing { text-align: center; padding: 64px 16px; color: var(--ink-2); }
.foot { color: var(--muted); font-size: 12px; margin: 8px 2px 0; max-width: 90ch; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 96px minmax(0, 1fr); }
  .photo { width: 96px; min-height: 128px; font-size: 24px; }
  .who { padding: 14px 16px; }
  .facts { grid-template-columns: 1fr; }
  .value { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .cols { grid-template-columns: 1fr; }
  th, td { padding: 8px 10px; }
}
</style>
</head>
<body>
<main>
  <a class="back" id="back" href="index.html">← All players</a>
  <div id="app"><p class="missing">Loading…</p></div>
</main>

<script src="data.js?v=202610041816"></script>
<script src="buyers.js?v=202610041816"></script>
<script>
const D = window.DATA, B = window.BUYERS || { clubs: [] }, YEARS = D.dates.map(d => d.slice(0, 4)), LAST = YEARS.length - 1;
const Q = new URLSearchParams(location.search), ID = +Q.get("id"), BUYER = B.clubs.find(c => String(c[0]) === Q.get("buyer"));
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const eur = k => k == null ? "–" : k === 0 ? "€0" : k >= 1000 ? "€" + (k / 1000).toFixed(k >= 10000 ? 0 : 1) + "m" : "€" + Math.round(k) + "k";
const pct = x => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(0) + "%";
const int = x => Math.round(x).toLocaleString("en");
const day = d => new Date(d + "T00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const groupOf = pos => pos === "Goalkeeper" ? 0 : /Midfield/.test(pos) ? 2 : /Back|Defen/.test(pos) ? 1 : 3;
// the six groups of parameters, in plain words
const GROUP_NAMES = ["His Transfermarkt value and its trend", "Age, position and nationality", "His club and its country",
  "Fees paid for him in the past", "Playing time, goals and results", "State of the transfer market"];
// shorter names for the reasons shown on the page
const PLAIN = { log_mv_pre: "Level of his Transfermarkt value", n_valuations: "How closely Transfermarkt follows him", years_tracked: "Years followed by Transfermarkt",
  mv_chg_6m: "Value change over 6 months", mv_chg_12m: "Value change over 12 months", mv_vs_peak: "Value compared with his peak",
  mv_pre_age_days: "Last Transfermarkt update", sell_country: "Country of his club", sell_league: "League of his club", citizenship: "Nationality",
  sub_position: "Position", log_seller_paid_fee: "Fee his club paid for him", log_prev_fee_paid: "Last fee paid for him",
  log_max_prev_fee: "Highest fee ever paid for him", tenure_days: "Time at his club", log_sell_income_3y: "His club's transfer income, 3 years",
  sell_club_log_ratio_3y: "How his club usually sells", sell_ppg: "His club's points per game", log_sell_squad_value: "Squad value of his club",
  mkt_log_ratio_1y: "Market level this year", min_seller_365: "Minutes for his club", min_trend: "Playing more or less than last year",
  ga_p90_365: "Goals + assists per 90 min", min_per_game_365: "Minutes per game", n_prev_transfers: "Number of past transfers" };
if (BUYER) $("back").href = "index.html?buyer=" + BUYER[0];

function crest(id, big) {
  if (!id) return "";
  const i = el("img", "crest" + (big ? " big" : "")); i.alt = ""; i.referrerPolicy = "no-referrer";
  i.src = "https://tmssl.akamaized.net/images/wappen/" + (big ? "head" : "small") + "/" + id + ".png";
  i.onerror = () => i.remove();
  return i;
}
function load(src, then) { const s = document.createElement("script"); s.src = src; s.onload = then; s.onerror = then; document.head.append(s); }
function chip(x, suffix) { return el("span", "chip " + (x >= 0 ? "up" : "down"), (x >= 0 ? "▲ " : "▼ ") + pct(x) + (suffix || "")); }
function box(title) { const b = el("section", "box"); b.append(el("h2", null, title)); return b; }

// how a parameter value is written
function show(key, v, p) {
  if (v == null || v === "NA" || v === "nan") return "not available";
  if (key === "sell_league") return p.league || "league not covered by the data";
  if (typeof v === "string") return v;
  if (/^log_/.test(key)) return eur(Math.exp(v) / 1000);
  if (key === "age") return Math.floor(v) + " years old";
  if (key === "years_tracked") return v.toFixed(1) + " years";
  if (key === "n_valuations") return int(v) + " valuations so far";
  if (key === "height_in_cm") return (v / 100).toFixed(2) + " m";
  if (key === "tenure_days") return v < 60 ? Math.round(v) + " days" : (v / 365.25).toFixed(1) + " years";
  if (key === "mv_pre_age_days") return int(v) + " days ago";
  if (/^mv_chg/.test(key)) return pct(Math.exp(v) - 1);
  if (key === "mv_vs_peak") return Math.round(Math.exp(v) * 100) + "% of his peak value";
  if (/log_ratio/.test(key)) return "×" + Math.exp(v).toFixed(2);
  if (/rate|share/.test(key)) return Math.round(v * 100) + "%";
  if (key === "min_trend") return (v >= 0 ? "+" : "−") + int(Math.abs(v)) + " min";
  if (/^min_|_min$/.test(key)) return int(v) + " min";
  if (/p90|ppg|points_per_game/.test(key)) return v.toFixed(2);
  if (key === "sell_youth_team" || key === "has_appearances") return v ? "yes" : "no";
  return int(v);
}

function chart(p, names) {
  const W = 560, H = 270, m = { l: 52, r: 40, t: 12, b: 74 }, ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Model price, Transfermarkt value and club by year");
  const add = (tag, attrs, text) => { const e = document.createElementNS(ns, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]); if (text != null) e.textContent = text; svg.append(e); return e; };
  const max = Math.max(...p.models.filter(v => v != null), ...p.tms.filter(v => v != null)) * 1.1 || 1;
  const x = i => m.l + i * (W - m.l - m.r) / LAST, y = v => H - m.b - v / max * (H - m.t - m.b);
  for (let i = 0; i <= 4; i++) { const v = max * i / 4;
    add("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: i ? "var(--line)" : "var(--axis)" });
    add("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, eur(Math.round(v))); }
  YEARS.forEach((yr, i) => {                      // under each year: the club of the player on 1 July
    add("text", { x: x(i), y: H - m.b + 18, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, yr);
    const id = p.clubs[i], name = names[id];
    if (!id || !name) return;
    const img = add("image", { href: "https://tmssl.akamaized.net/images/wappen/small/" + id + ".png", x: x(i) - 11, y: H - m.b + 25, width: 22, height: 22 });
    img.addEventListener("error", () => img.remove());
    add("text", { x: x(i), y: H - 8, "text-anchor": "middle", "font-size": 10, fill: "var(--ink-2)" }, name.length > 14 ? name.slice(0, 13) + "…" : name);
  });
  const cross = add("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", visibility: "hidden" });
  for (const [vals, color] of [[p.tms, "var(--tm)"], [p.models, "var(--model)"]]) {
    const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    add("polyline", { points: pts.map(a => a.join(",")).join(" "), fill: "none", stroke: color, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round" });
    pts.forEach(a => add("circle", { cx: a[0], cy: a[1], r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
  }
  const wrap = el("div", "chart"), tip = el("div", "tip"); wrap.append(svg, tip);
  svg.addEventListener("pointermove", e => {
    const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * W;
    const i = Math.max(0, Math.min(LAST, Math.round((px - m.l) / ((W - m.l - m.r) / LAST))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    tip.textContent = `${YEARS[i]}${names[p.clubs[i]] ? " · " + names[p.clubs[i]] : ""} · Model ${eur(p.models[i])} · Transfermarkt ${eur(p.tms[i])}`;
    tip.style.display = "block";
    tip.style.left = Math.min(b.width - tip.offsetWidth, Math.max(0, x(i) / W * b.width - tip.offsetWidth / 2)) + "px";
    tip.style.top = "0px";
  });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  return wrap;
}

function render(p, x, names) {
  const app = $("app"); app.replaceChildren();
  document.title = p.name + " · Player Fee Model";
  const V = Object.fromEntries(D.params.map((q, i) => [q[0], x.v[i]])), C = x.c.map(v => v / 1000), base = C[C.length - 1];
  const g = groupOf(p.pos), realMoves = x.moves.filter(m => m[4] !== 7), moves = (realMoves.length ? realMoves : x.moves).slice().reverse();
  const joined = x.moves.slice().reverse().find(m => m[2] === p.clubId);

  // ---- header
  const hero = el("section", "hero"), who = el("div", "who"), value = el("div", "value");
  const initials = el("div", "photo", p.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase());
  let photo = initials;
  if (p.photo) { photo = el("img", "photo"); photo.alt = ""; photo.referrerPolicy = "no-referrer";
    photo.src = "https://img.a.transfermarkt.technology/portrait/header/" + p.id + "-" + p.photo; photo.onerror = () => photo.replaceWith(initials); }
  const clubline = el("div", "clubline");
  const clubText = p.free ? "Free agent · last club " + (p.club || "unknown") : [p.club, p.league].filter(Boolean).join(" · ") || "No club";
  if (!p.free && B.clubs.some(c => c[0] === p.clubId)) { const a = el("a", "clublink", clubText); a.href = "club.html?id=" + p.clubId; clubline.append(crest(p.clubId, true), a); }
  else clubline.append(crest(p.clubId, true), clubText);
  const facts = el("dl", "facts"), fact = (k, v) => { if (v == null || v === "" || v === "not available") return;
    const d = el("div"); d.append(el("dt", null, k + ":"), el("dd", null, v)); facts.append(d); };
  fact("Date of birth", x.born ? day(x.born) + " (" + Math.floor(p.age) + ")" : Math.floor(p.age) + " years");
  fact("Position", p.pos);
  fact("Height", show("height_in_cm", V.height_in_cm, p));
  fact("Foot", V.foot && V.foot !== "NA" && V.foot !== "nan" ? V.foot[0].toUpperCase() + V.foot.slice(1) : null);
  fact("Citizenship", V.citizenship !== "NA" ? V.citizenship : null);
  if (!p.free && joined) { fact("Joined", day(joined[0])); fact("Fee paid", joined[4] === 0 && joined[3] ? eur(joined[3]) : joined[4] === 2 ? "Loan" : D.move_kinds[joined[4]]); }
  who.append(el("h1", null, p.name), clubline, facts);
  const tm = el("div", "tm"), tmLabel = el("span"); tmLabel.append(el("small", null, "Transfermarkt "), el("b", null, eur(p.tm)));
  tm.append(tmLabel, chip(p.base / p.tm - 1));
  value.append(el("small", null, "Model price · 1 July 2026"), el("div", "big", eur(p.base)), el("small", null, eur(p.baseLo) + " – " + eur(p.baseHi)), tm);
  hero.append(photo, who, value); app.append(hero);
  if (BUYER) load("buyers/" + BUYER[0] + ".js?v=" + B.version, () => {
    const raw = window.BUYER_DATA && window.BUYER_DATA[BUYER[0]]; if (!raw) return;
    const v = Int8Array.from(atob(raw), c => c.charCodeAt(0))[p.idx], d = el("div", "buyer"), b = el("b");
    const price = p.tm * Math.exp(v * B.step), rg = B.range[B.range_edges.filter(e => p.tm >= e).length], rough = p.tm < BUYER[3] || p.tm > BUYER[4];
    b.append(crest(BUYER[0], true), v === -128 ? "Already there" : eur(price));
    d.append(el("small", null, "If " + BUYER[1] + " buys"), b);
    if (v !== -128) d.append(el("small", null, rough ? "rough guess, unusual deal" : eur(price / rg) + " – " + eur(price * rg)));
    value.append(d); });

  const cols = el("div", "cols"), left = el("div"), right = el("div"); cols.append(left, right); app.append(cols);

  // ---- value over time
  const time = box("Market value"), tin = el("div", "in"), legend = el("div", "legend");
  for (const [label, c] of [["Model price", "var(--model)"], ["Transfermarkt value", "var(--tm)"]]) { const s = el("span"), i = el("i"); i.style.background = c; s.append(i, label); legend.append(s); }
  tin.append(legend, chart(p, D.club_names || {})); time.append(tin); left.append(time);

  // ---- transfer history
  const hist = box("Transfer history"), ht = el("table"), hh = el("tr");
  ["Date", "From", "To", "Fee"].forEach((k, i) => hh.append(el("th", i === 1 || i === 2 ? "club" : null, k))); ht.append(hh);
  moves.forEach(([date, from, to, fee, kind, note]) => {
    const r = el("tr"), side = id => { const td = el("td", "club"), s = el("span"); s.append(crest(id), names[id] || "Unknown"); td.append(s); return td; };
    const paid = kind === 0 && fee;
    const text = paid ? eur(fee) : kind === 2 ? "Loan" + (fee ? " (fee " + eur(fee) + ")" : "") : kind === 0 ? "Transfer" : D.move_kinds[kind];
    const td = el("td", "fee" + (paid ? "" : " soft"), text); if (note) td.title = note;
    r.append(el("td", null, day(date)), side(from), side(to), td); ht.append(r);
  });
  if (!moves.length) { const r = el("tr"), td = el("td", null, "No move on record."); td.colSpan = 4; r.append(td); ht.append(r); }
  const sc = el("div", "scroll"); sc.append(ht); hist.append(sc); left.append(hist);

  // ---- why this price: the main reasons only
  const why = box("Why this price"), win = el("div", "in"), sum = el("div", "sum"), ul = el("ul", "why");
  sum.append(el("span", null, "From the Transfermarkt value to the model price"), chip(p.base / x.mv - 1));
  D.params.map((q, i) => ({ q, i, c: C[i] })).sort((a, b) => Math.abs(b.c) - Math.abs(a.c)).slice(0, 5).forEach(r => {
    const li = el("li"), d = el("div"); d.append(PLAIN[r.q[0]] || r.q[1], el("small", null, show(r.q[0], x.v[r.i], p))); li.append(d, chip(Math.exp(r.c) - 1)); ul.append(li); });
  win.append(sum, ul); why.append(win);
  const more = el("details", "more"), mt = el("table"); more.append(el("summary", null, "Full calculation"));
  let run = x.mv;
  const row = (name, log) => { const r = el("tr"); if (log != null) run *= Math.exp(log);
    r.append(el("td", null, name), el("td", null, log == null ? "" : pct(Math.exp(log) - 1)), el("td", null, eur(run))); mt.append(r); };
  row("Transfermarkt value");
  row("Average gap between fees and values", base);
  GROUP_NAMES.forEach((name, gi) => row(name, D.params.reduce((s, q, i) => s + (q[2] === gi ? C[i] : 0), 0)));
  const last = el("tr"); last.append(el("td", null, "Model price"), el("td"), Object.assign(el("td", "fee"), { textContent: eur(p.base) })); mt.append(last);
  const ms = el("div", "scroll"); ms.append(mt); more.append(ms, el("p", "note", "Each line multiplies the price. These are the model's own reasons, not proof of what clubs pay for."));
  why.append(more); right.append(why);

  // ---- statistics: one short table
  const stats = box("Last 365 days");
  if (!V.has_appearances) stats.append(Object.assign(el("div", "in"), { textContent: "No match data for this player: the source only covers top divisions and European cups." }));
  else {
    const t = el("table"), keeper = g === 0, back = g <= 1;
    const rows = [["Games", int(V.games_365)], ["Minutes", int(V.min_365)]];
    if (!keeper) rows.push(["Goals", int(V.goals_365)], ["Assists", int(V.assists_365)]);
    if (back) rows.push(["Games without conceding", show("clean_sheet_rate_365", V.clean_sheet_rate_365, p)], ["Goals conceded per 90 min", show("conceded_p90_365", V.conceded_p90_365, p)]);
    else rows.push(["Goals + assists per 90 min", show("ga_p90_365", V.ga_p90_365, p)]);
    rows.push(["Career games", int(V.career_games)]); if (!keeper) rows.push(["Career goals", int(V.career_goals)]);
    rows.forEach(([k, v]) => { const r = el("tr"); r.append(el("td", null, k), el("td", "fee", v)); t.append(r); });
    stats.append(t);
  }
  right.append(stats);
  app.append(el("p", "foot", (p.free ? "Out of contract on 1 July 2026: no fee would be paid for him; the price is what he would cost under contract at his last club. " : "")
    + "Data: Transfermarkt, via the open transfermarkt-datasets project, up to 6 July 2026. Loans and free transfers are deduced from the moves."));
}

(function start() {
  const idx = D.players.findIndex(r => r[0] === ID);
  if (idx < 0) { $("app").replaceChildren(el("p", "missing", "Player not found. Go back to the list and pick a player.")); return; }
  const r = D.players[idx];
  const p = { idx, id: r[0], name: r[1], club: r[2], league: r[3], country: r[4], pos: r[5], age: r[6], tms: r[7], models: r[8], tm: r[7][LAST],
    base: r[8][LAST], baseLo: r[9], baseHi: r[10], clubId: r[11], photo: r[12], clubs: r[13] || [], free: !!r[14] };
  const b = ID % D.player_files;
  load("players/" + b + ".js?v=" + B.version, () => {
    const data = window.PLAYERS && window.PLAYERS[b], x = data && data.players[ID];
    if (!x) { $("app").replaceChildren(el("p", "missing", "The profile of this player could not be loaded.")); return; }
    render(p, x, Object.assign({}, D.club_names, data.names));
  });
})();
</script>
</body>
